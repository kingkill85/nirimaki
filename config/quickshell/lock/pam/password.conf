#
# PAM stack for the Quickshell lock screen. Mirrors /etc/pam.d/gtklock —
# `include login` is the standard interactive-prompt stack that uses
# pam_unix via the setuid `unix_chkpwd` helper, so an unprivileged
# user-space app (like us) can still verify the password against
# /etc/shadow.
#
# We previously used `include system-auth`, which is designed for a
# multi-module stack and expects an earlier module to have stored the
# password via `try_first_pass`; called standalone, every authentication
# attempt failed.
#
auth     include  login
account  include  login

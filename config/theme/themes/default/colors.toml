# Default theme. Mirrors the values that were hard-coded in Theme.qml
# through Phases A–C. Schema is intentionally a strict subset of the
# Omarchy themes/<name>/colors.toml format so any of those drop in
# verbatim once D2 wires the singleton up.

[colors]
# Foundational palette
accent               = "#cacccc"
foreground           = "#cacccc"
background           = "#101315"
cursor               = "#cacccc"
selection_foreground = "#101315"
selection_background = "#cacccc"

# 16-colour terminal palette. Muted monochrome with a single warm red
# for errors / urgency. Matches the existing #a55555 urgent token and
# the JetBrainsMonoNL feel of the shell.
color0  = "#1d1f21"   # black
color1  = "#a55555"   # red
color2  = "#708e4a"   # green
color3  = "#c9a04a"   # yellow
color4  = "#5586a8"   # blue
color5  = "#8e6fa5"   # magenta
color6  = "#5fa5a5"   # cyan
color7  = "#cacccc"   # white

color8  = "#5a5c5c"   # bright black
color9  = "#c46d6d"   # bright red
color10 = "#88a85f"   # bright green
color11 = "#d8b86d"   # bright yellow
color12 = "#76a3c5"   # bright blue
color13 = "#a78dc1"   # bright magenta
color14 = "#76bdbd"   # bright cyan
color15 = "#e0e2e2"   # bright white

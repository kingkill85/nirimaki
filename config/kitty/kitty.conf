# Drop the Wayland CSD title bar.
# Niri's focus ring sits around the window edges instead.
hide_window_decorations yes

# Force fish as the interactive shell. Without this kitty inherits
# whatever $SHELL was set to when the graphical session started — any
# session that began before `chsh -s /usr/bin/fish` would keep spawning
# bash. Explicit > implicit.
shell /usr/bin/fish

# Don't confirm on Ctrl+Shift+Q / window close.
confirm_os_window_close 0

# Font — Nerd Font is required because the bar + starship + lazygit
# + eza all use Nerd Font glyphs; using a non-Nerd font here makes
# those render as missing-glyph boxes. Size left at kitty's default
# (11pt) — Omarchy ships 9pt but that's small on 1440p+ screens.
font_family      JetBrainsMono Nerd Font
bold_italic_font auto

# Padding around the cell grid. Omarchy ships 14; we match.
window_padding_width 14

# Translucency control:
#   - Effective alpha is set at the compositor level via niri
#     window-rules (`opacity 0.85` for tiled kitty, `opacity 0.92`
#     for floating TUIs).
#   - The 0.99 here just forces kitty to allocate an RGBA buffer.
#     Without it kitty draws RGB on AMD and niri's opacity multiplier
#     becomes a no-op (niri#2346). Effectively still opaque from
#     kitty's side; the visible translucency is the niri rule on top.
background_opacity 0.99
dynamic_background_opacity yes

# Kitty IPC — lets us drive kitty from scripts (`kitty @ launch`,
# `kitty @ ls`, etc.). Omarchy enables this; useful for future
# scripted-tab/scripted-pane workflows.
allow_remote_control yes

# Cursor aesthetics — Omarchy parity. The `shell_integration no-cursor`
# stops kitty's shell-integration shim from forcing its own cursor
# shape, letting our `cursor_shape block` actually stick.
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor
enable_audio_bell     no

# Wire Ctrl+Insert / Shift+Insert as copy / paste — kitty doesn't do
# this by default. The niri Mod+C / Mod+V / Mod+X universal-clipboard
# binds inject Ctrl+Insert / Shift+Insert / Ctrl+X via wtype, and we
# need kitty to recognise them. Without these maps the wtype injection
# lands but kitty does nothing with it. Same fix Omarchy ships.
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard

# Tab bar — Omarchy parity. Bottom-anchored powerline tabs, slanted
# style, title template includes pane-count when >1.
tab_bar_edge       bottom
tab_bar_style      powerline
tab_powerline_style slanted
tab_title_template {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Theme — colours rendered by qs-theme-set into the active theme dir.
# kitty re-reads on SIGUSR1, which qs-theme-set sends after each swap.
include ~/.config/theme/current/kitty.conf

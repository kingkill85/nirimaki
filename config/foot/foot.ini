# foot — Nirimaki's default terminal (replaced kitty in the rebind).
# Lives in the repo at config/foot/, symlinked into ~/.config/foot/ by
# dev-link.sh so edits land in the live session immediately.

# Interactive shell — explicit so a graphical session that started
# before `chsh -s /usr/bin/fish` (or under a service that ignores the
# user's login shell) still drops into fish. Same rationale as the
# previous kitty `shell` line.
shell=/usr/bin/fish
login-shell=yes

# Font — Nerd Font required because the bar / starship / lazygit / eza
# all use Nerd Font glyphs; a non-Nerd font renders them as missing-
# glyph boxes. Size left at 11 to match the previous kitty config (the
# Omarchy 9pt default is small at 1440p+).
font=JetBrainsMono Nerd Font:size=11

# Padding around the cell grid (Omarchy parity: 14 / 14).
pad=14x14

# Word delimiters trimmed from default so double-click on a path
# selects the whole path. Same defaults Omarchy ships for kitty.
word-delimiters=,│`|:"'()[]{}<>

# Selection lands directly on the system clipboard so Mod+V / Ctrl+V
# in any other app pastes what was just selected (Omarchy convention).
selection-target=clipboard

# Theme — palette + alpha rendered by qs-theme-set into the active
# theme dir, loaded by every NEW foot instance on launch. Running
# instances get live-recoloured via OSC palette sequences written
# to their pts slave by qs-theme-set (foot's SIGUSR1 only toggles
# the in-memory [colors-dark] / [colors-light] pair — it does NOT
# re-read this file). include= must live at the top level, above
# any section header, for foot to recognise it as a directive.
include=~/.config/theme/current/foot.ini

# CSD off — niri draws focus-ring borders around every window and
# foot's own title bar would just duplicate the column gap.
[csd]
preferred=none

[cursor]
style=block
blink=no

# Universal-clipboard inject support — keybinds.kdl's Mod+C / Mod+V /
# Mod+X bind wtype to type Ctrl+Insert / Shift+Insert / Ctrl+X into
# the focused window. foot's defaults already wire Ctrl+Insert →
# clipboard-copy, but Shift+Insert is bound to `primary-paste` which
# pastes the PRIMARY selection rather than CLIPBOARD. Free the chord
# (foot rejects duplicate bindings outright) and re-bind it onto
# clipboard-paste so the wtype-injected Shift+Insert actually pastes
# the system clipboard. Same fix the kitty config used to ship.
[key-bindings]
primary-paste=none
clipboard-copy=Control+Shift+c XF86Copy Control+Insert
clipboard-paste=Control+Shift+v XF86Paste Shift+Insert

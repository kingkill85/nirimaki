<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Nirimaki — regional Noto CJK preference.

  Without this, `fc-match "sans:lang=zh"` resolves to Noto CJK JP
  instead of SC, so Chinese pages render with Japanese glyph forms
  (subtly wrong; native readers catch it instantly). Same issue for
  Korean → JP.

  Prefixed `99-` so the rules apply AFTER Noto's own conf files and
  override the default JP preference via mode="prepend" binding="strong".

  Verify after install:
    fc-match "sans:lang=zh"      → "Noto Sans CJK SC"
    fc-match "serif:lang=zh"     → "Noto Serif CJK SC"
    fc-match "monospace:lang=zh" → "Noto Sans Mono CJK SC"
    fc-match "sans:lang=ko"      → "Noto Sans CJK KR"
    fc-match "sans:lang=ja"      → "Noto Sans CJK JP" (unchanged)
-->
<fontconfig>
  <!-- Chinese: zh / zh-cn / zh-tw / zh-hk all default to Simplified.
       If TC/HK glyphs become wanted later, add more-specific rules
       (e.g. <test ...><string>zh-tw</string></test>) below the bare-zh
       rules in this file — later prepends win. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>

  <!-- Korean: ko / ko-kr -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK KR</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Mono CJK KR</string>
    </edit>
  </match>
</fontconfig>
